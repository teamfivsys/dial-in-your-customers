events {}
http {
 server {
  listen 8000;
  # Loopback test gateway ONLY. Hosted Supabase supplies its own managed CORS layer.
  add_header Access-Control-Allow-Origin "http://127.0.0.1:4173" always;
  add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, x-supabase-api-version, content-profile, accept-profile" always;
  add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
  if ($request_method = OPTIONS) { return 204; }
  location /rest/v1/ { proxy_hide_header Access-Control-Allow-Origin; proxy_pass http://kdial-rest:3000/; }
  location /auth/v1/ { proxy_hide_header Access-Control-Allow-Origin; proxy_pass http://kdial-auth:9999/; }
  location /functions/v1/ { proxy_hide_header Access-Control-Allow-Origin; proxy_pass http://kdial-edge:9000/; }
 }
}
