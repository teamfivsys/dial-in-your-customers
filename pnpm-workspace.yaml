# Only the native build helpers used by Vite's SWC plugin need install scripts.
# Explicit allowlisting keeps non-interactive hosting installs reproducible under pnpm 11.
allowBuilds:
  '@swc/core': true
  esbuild: true
# Patched build parser, compatible with the existing Tailwind 3 toolchain.
overrides:
  postcss-selector-parser: ^7.1.6
patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
